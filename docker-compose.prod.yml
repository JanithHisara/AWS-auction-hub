# Overlay for the updated 2026-11-17 AuctionHub code.
# Execute on EC2 using: docker compose --env-file .env -f docker-compose.prod.yml ...
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &limited_logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/auctionhub-backend:${IMAGE_TAG:-bootstrap}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      API_PORT: "4000"
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Set FRONTEND_ORIGINS}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:?Set SUPER_ADMIN_EMAILS}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
    volumes:
      - app_uploads:/app/uploads
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s
    logging: *limited_logs

  frontend:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/auctionhub-frontend:${IMAGE_TAG:-bootstrap}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      PORT: "3000"
      API_ORIGIN: http://backend:4000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:?Set SUPER_ADMIN_EMAILS}
    expose:
      - "3000"
    logging: *limited_logs

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *limited_logs

volumes:
  postgres_data:
  app_uploads:
  caddy_data:
  caddy_config:
